<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>witam witam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=STIX+Two+Math&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>

    <main class="layout">
      <section class="panel">
        <h1>witam witam</h1>
        <p class="muted">Generate worksheets and tune behavior + style live.</p>

        <div class="group">
          <h2>Problem Rules</h2>

          <label>
            Number of problems
            <input id="problemCount" type="number" min="1" max="50" value="10" />
          </label>

          <label>
            Minimum number
            <input id="minValue" type="number" value="1" />
          </label>

          <label>
            Maximum number
            <input id="maxValue" type="number" value="20" />
          </label>

          <div class="inline">
            <label class="check">
              <input id="opPow" type="checkbox" checked />
              Power Rule: d/dx(ax^n)
            </label>
            <label class="check">
              <input id="opRoot" type="checkbox" checked />
              Chain Rule: d/dx((ax+b)^n)
            </label>
          </div>

          <label class="check">
            <input id="allowNegatives" type="checkbox" />
            Allow negative values
          </label>

          <label class="check">
            <input id="allowDecimals" type="checkbox" />
            Allow decimals (1 decimal place)
          </label>
        </div>

        <div class="group">
          <h2>Look & Feel</h2>

          <label>
            Primary color
            <input id="primaryColor" type="color" value="#f97316" />
          </label>

          <label>
            Surface color
            <input id="surfaceColor" type="color" value="#fff7ed" />
          </label>

          <label>
            Radius (px)
            <input id="radius" type="number" min="0" max="40" value="20" />
          </label>

          <label>
            Card gap (px)
            <input id="gap" type="number" min="8" max="40" value="14" />
          </label>
        </div>

        <div class="actions">
          <button id="generateBtn">Generate Problems</button>
          <button id="toggleAnswersBtn" class="secondary">Show Answers</button>
          <button id="resetBtn" class="secondary">Reset Settings</button>
        </div>
      </section>

      <section class="sheet-wrap">
        <div class="sheet-head">
          <div class="sheet-title-wrap">
            <h2>uwaga commit</h2>
            <button
              id="uwagaAnimBtn"
              class="uwaga-anim-btn"
              type="button"
              aria-pressed="false"
            >
              kliknij
            </button>
          </div>
          <span id="sheetMeta" class="muted"></span>
        </div>
        <div id="problemGrid" class="problem-grid"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
